global:
  image:
    # -- if set it will overwrite all registry entries
    # 注意：registry 不應該包含結尾斜線，例如 "10.11.233.138/rpa" 而不是 "10.11.233.138/rpa/"
    # registry: "10.11.233.138/rpa"
    registry:
  # security:
  #   # required for bitnamilegacy repos
  #   allowInsecureImages: true

  pullSecrets:
    - name: rpasecret
  # pullSecrets: []

  # 影響不到其他區域的設定 (純粹用來記錄)
  persistence:
    # existingClaim: "nextcloud-nextcloud"  # 使用現有的 PVC，舊的 StorageClass會被忽略
    # storageClass: "rpa-sc-nfs"
    # storageClass: "standard" # 使用自動 provisioner，避免 PV 綁定問題
    accessMode: ReadWriteOnce
    size: 50Gi

## ref: https://hub.docker.com/r/library/nextcloud/tags/
##
image:
  registry: docker.io
  # registry:
  repository: library/nextcloud
  flavor: apache
  # default is generated by flavor and appVersion
  tag: 32.0.5
  pullPolicy: IfNotPresent
  # pullSecrets:
  #   - myRegistrKeySecretName

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
deploymentLabels: {}

# Number of replicas to be deployed
replicaCount: 1

httpRoute:
  # -- Enable an HTTPRoute resource for nextcloud .
  enabled: false
  # -- Set the route apiVersion
  apiVersion: gateway.networking.k8s.io/v1
  # -- Set the route kind
  kind: HTTPRoute

  # -- Route annotations
  annotations: {}
  # -- Route labels
  labels: {}
  # -- Route hostnames
  hostnames: []
  # -- Reference to parent gateways
  parentRefs: []
  # -- List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

