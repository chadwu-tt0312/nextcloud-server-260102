# 需在 NFS server 10.11.109.21 預先建立目錄：
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/data
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/local
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/db
#
# Secret 建立：
#   kubectl create secret generic nextcloud-env --from-env-file=nextcloud.env -n <namespace>
# 範例檔見 nextcloud.env.example
#
# 部署順序建議：先 apply StatefulSet、Service、Nextcloud Deployment 與 Service，
# 待 Nextcloud Pod 就緒後再 apply 下方的 nextcloud-trusted-domains-init Job（或一併 apply，Job 會重試直到 occ 可用）。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-db
spec:
  serviceName: nextcloud-db
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      imagePullSecrets:
        - name: rpasecret
      containers:
        - name: mariadb
          image: 10.11.233.138/nextcloud/mariadb:10.11.15
          envFrom:
            - secretRef:
                name: nextcloud-env
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mariadb-data
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/db
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  labels:
    app: nextcloud-db
spec:
  type: ClusterIP
  selector:
    app: nextcloud-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      imagePullSecrets:
        - name: rpasecret
      containers:
        - name: nextcloud
          image: 10.11.233.138/nextcloud/nextcloud:32.0.3
          envFrom:
            - secretRef:
                name: nextcloud-env
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
            - name: nextcloud-local
              mountPath: /var/local
      volumes:
        - name: nextcloud-data
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/data
        - name: nextcloud-local
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/local

---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  type: NodePort
  selector:
    app: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30805

---
# 一次性 Job：等待 Nextcloud occ 可用後設定 trusted_domains（取代 postStart，避免逾時）
# 請於 Nextcloud Deployment 就緒後 apply，或與上方資源一併 apply（Job 會重試直到成功）
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-trusted-domains-init
spec:
  completions: 1
  backoffLimit: 60
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: rpasecret
      containers:
        - name: init-trusted-domains
          image: 10.11.233.138/nextcloud/nextcloud:32.0.3
          envFrom:
            - secretRef:
                name: nextcloud-env
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
            - name: nextcloud-local
              mountPath: /var/local
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 120); do
                php /var/www/html/occ status 2>/dev/null && break
                sleep 10
              done
              php /var/www/html/occ config:system:set trusted_domains 1 --value='*' || true
              echo "==> set trusted_domains completed."
      volumes:
        - name: nextcloud-data
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/data
        - name: nextcloud-local
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/local
