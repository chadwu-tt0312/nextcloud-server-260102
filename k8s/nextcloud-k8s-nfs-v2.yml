# 需在 NFS server 10.11.109.21 預先建立目錄：
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/data
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/local
#   /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/db
#
# Secret 建立：
#   kubectl create secret generic nextcloud-env --from-env-file=nextcloud.env -n <namespace>
# 範例檔見 nextcloud.env.example
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-db
spec:
  serviceName: nextcloud-db
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      imagePullSecrets:
        - name: rpasecret
      containers:
        - name: mariadb
          image: 10.11.233.138/nextcloud/mariadb:10.11.15
          envFrom:
            - secretRef:
                name: nextcloud-env
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/db
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  labels:
    app: nextcloud-db
spec:
  type: ClusterIP
  selector:
    app: nextcloud-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      imagePullSecrets:
        - name: rpasecret
      containers:
        - name: nextcloud
          image: 10.11.233.138/nextcloud/nextcloud:32.0.3
          envFrom:
            - secretRef:
                name: nextcloud-env
          ports:
            - containerPort: 80
          lifecycle:
            # Nextcloud 初始化需數分鐘，輪詢直到 occ 可用後設定 trusted_domains
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      php /var/www/html/occ status 2>/dev/null && break
                      sleep 10
                    done
                    php /var/www/html/occ config:system:set trusted_domains 1 --value='*' || true
                    echo "==> set trusted_domains completed."
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
            - name: nextcloud-local
              mountPath: /var/local
      volumes:
        - name: nextcloud-data
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/data
        - name: nextcloud-local
          nfs:
            server: 10.11.109.21
            path: /gpfsvol/UGPTs_prod/Tanzu/smgpjt/nextcloud/local

---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  type: NodePort
  selector:
    app: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30805
